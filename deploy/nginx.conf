# Minimal nginx config for serving the built portfolio site.
# Place at /etc/nginx/sites-available/portfolio, then:
#   ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx

server {
    listen 127.0.0.1:8080;
    server_name _;

    # Point this at wherever you clone the repo (e.g. /opt/portfolio-tailwind/dist in the Proxmox LXC guide)
    root /opt/portfolio-tailwind/dist;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Reasonable caching for hashed static assets Vite outputs
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve the branded 404 page (dist/404.html, built from 404.html)
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
